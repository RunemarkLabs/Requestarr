name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  TEST_FILTER_COMMON: "Category!=ManualTest&Category!=IntegrationTest&Category!=AutomationTest"

jobs:
  backend-linux:
    name: Backend (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build src/Requestarr.sln -c Debug -p:Platform=Posix
      - name: Test
        working-directory: _tests/net10.0
        run: >
          dotnet test
          Requestarr.Api.V1.Test.dll Requestarr.Common.Test.dll Requestarr.Core.Test.dll
          Requestarr.Host.Test.dll Requestarr.Libraries.Test.dll Requestarr.Mono.Test.dll
          Requestarr.Update.Test.dll
          "--filter:${{ env.TEST_FILTER_COMMON }}&Category!=WINDOWS"

  backend-windows:
    name: Backend (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build src/Requestarr.sln -c Debug -p:Platform=Windows
      - name: Test
        working-directory: _tests/net10.0
        shell: bash
        run: >
          dotnet test
          Requestarr.Api.V1.Test.dll Requestarr.Common.Test.dll Requestarr.Core.Test.dll
          Requestarr.Host.Test.dll Requestarr.Libraries.Test.dll Requestarr.Update.Test.dll
          Requestarr.Windows.Test.dll
          "--filter:${{ env.TEST_FILTER_COMMON }}&Category!=LINUX"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile --network-timeout 120000
      - name: Type check
        run: yarn tsc --noEmit
      - name: Lint
        run: yarn lint
      - name: Style lint
        run: yarn stylelint-linux
      - name: Production build
        run: yarn build --env production

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: requestarr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Fails a change that adds a credential. The full history was scanned when this was added.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS: ghcr.io/gitleaks/gitleaks:v8.21.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scanner self-test (a fake token generated here must be caught)
        run: |
          mkdir -p /tmp/selftest
          echo "token = ghp_$(head -c 300 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)" > /tmp/selftest/fake.txt
          if docker run --rm -v /tmp/selftest:/scan "$GITLEAKS" dir /scan --no-banner --redact; then
            echo "::error::The secret scanner missed a generated fake token"
            exit 1
          fi
          echo "Self-test passed: the scanner caught the generated fake token."
      - name: Scan the commits in this change
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] && ! echo "${{ github.event.before }}" | grep -qE '^0+$'; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }}~1..${{ github.sha }}"
          fi
          echo "Scanning commits $range"
          docker run --rm -v "$PWD:/repo" --entrypoint sh "$GITLEAKS" -c             "git config --global --add safe.directory /repo && gitleaks git /repo --log-opts='$range' --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore --no-banner --redact --verbose"

  # Every pull request records its changes in CHANGELOG.md under a new, higher version (docs/development.md#changelog).
  # Into dev or qa, the version must also be free on the other branch (release.sh check-changelog).
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CHANGELOG.md has a new version for this change
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "Not a pull request: nothing to check."
            exit 0
          fi
          ./release.sh check-changelog "$BASE_SHA" HEAD "$BASE_REF" "$HEAD_SHA"

  # A promotion into qa (dev's commits) happens only on the owner's word, and the pull request records it
  # (docs/development.md#release-flow).
  promotion:
    name: Promotion record
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: A promotion names who asked for it
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT" != "pull_request" ] || [ "$BASE_REF" != "qa" ]; then
            echo "Not a pull request into qa: nothing to check."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$HEAD_SHA" origin/dev; then
            echo "A fix into qa, not a promotion: nothing to check."
            exit 0
          fi
          if ! printf '%s\n' "$BODY" | grep -qE '^Requested by: .+'; then
            echo "::error::A promotion to QA needs a 'Requested by:' line naming who asked and their words (./release.sh promote-qa writes it)."
            exit 1
          fi
          printf '%s\n' "$BODY" | grep -m1 -E '^Requested by: '

  # Single status for the dev, qa and main branch rules to require.
  build:
    name: build
    if: always()
    needs: [backend-linux, backend-windows, frontend, docker, secrets, changelog, promotion]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
