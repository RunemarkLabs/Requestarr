name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  TEST_FILTER_COMMON: "Category!=ManualTest&Category!=IntegrationTest&Category!=AutomationTest"

jobs:
  backend-linux:
    name: Backend (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build src/Requestarr.sln -c Debug -p:Platform=Posix
      - name: Test
        working-directory: _tests/net10.0
        run: >
          dotnet test
          Requestarr.Api.V1.Test.dll Requestarr.Common.Test.dll Requestarr.Core.Test.dll
          Requestarr.Host.Test.dll Requestarr.Libraries.Test.dll Requestarr.Mono.Test.dll
          Requestarr.Update.Test.dll
          "--filter:${{ env.TEST_FILTER_COMMON }}&Category!=WINDOWS"

  backend-windows:
    name: Backend (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build src/Requestarr.sln -c Debug -p:Platform=Windows
      - name: Test
        working-directory: _tests/net10.0
        shell: bash
        run: >
          dotnet test
          Requestarr.Api.V1.Test.dll Requestarr.Common.Test.dll Requestarr.Core.Test.dll
          Requestarr.Host.Test.dll Requestarr.Libraries.Test.dll Requestarr.Update.Test.dll
          Requestarr.Windows.Test.dll
          "--filter:${{ env.TEST_FILTER_COMMON }}&Category!=LINUX"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile --network-timeout 120000
      - name: Type check
        run: yarn tsc --noEmit
      - name: Lint
        run: yarn lint
      - name: Style lint
        run: yarn stylelint-linux
      - name: Production build
        run: yarn build --env production

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: requestarr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Fails a change that adds a credential. The full history was scanned when this was added.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS: ghcr.io/gitleaks/gitleaks:v8.21.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scanner self-test (a fake token generated here must be caught)
        run: |
          mkdir -p /tmp/selftest
          echo "token = ghp_$(head -c 300 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)" > /tmp/selftest/fake.txt
          if docker run --rm -v /tmp/selftest:/scan "$GITLEAKS" dir /scan --no-banner --redact; then
            echo "::error::The secret scanner missed a generated fake token"
            exit 1
          fi
          echo "Self-test passed: the scanner caught the generated fake token."
      - name: Scan the commits in this change
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] && ! echo "${{ github.event.before }}" | grep -qE '^0+$'; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }}~1..${{ github.sha }}"
          fi
          echo "Scanning commits $range"
          docker run --rm -v "$PWD:/repo" --entrypoint sh "$GITLEAKS" -c             "git config --global --add safe.directory /repo && gitleaks git /repo --log-opts='$range' --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore --no-banner --redact --verbose"

  # Every pull request records its changes in CHANGELOG.md under a new, higher version (docs/development.md#changelog).
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CHANGELOG.md has a new version for this change
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request: nothing to check."
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if ! git diff --name-only "$base" HEAD | grep -qx 'CHANGELOG.md'; then
            echo "::error::Add a section for this change at the top of CHANGELOG.md (see docs/development.md#changelog)."
            exit 1
          fi
          top() { grep -m1 -E '^## [0-9]+\.[0-9]+\.[0-9]+' | sed -E 's/^## +//; s/ .*//'; }
          new=$(top < CHANGELOG.md)
          old=$(git show "$base:CHANGELOG.md" 2>/dev/null | top || true)
          echo "Top version: base ${old:-none}, this change ${new:-none}"
          if [ -z "$new" ]; then
            echo "::error::CHANGELOG.md needs a '## x.y.z' section at the top."
            exit 1
          fi
          if [ -n "$old" ] && { [ "$new" = "$old" ] || [ "$(printf '%s\n' "$old" "$new" | sort -V | tail -1)" != "$new" ]; }; then
            echo "::error::The top version in CHANGELOG.md ($new) must be higher than main's ($old); bump <AssemblyVersion> in src/Directory.Build.props to match."
            exit 1
          fi

  # Single status for the main branch ruleset to require.
  build:
    name: build
    if: always()
    needs: [backend-linux, backend-windows, frontend, docker, secrets, changelog]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
