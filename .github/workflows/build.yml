name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  TEST_FILTER_COMMON: "Category!=ManualTest&Category!=IntegrationTest&Category!=AutomationTest"

jobs:
  backend-linux:
    name: Backend (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build src/Requestarr.sln -c Debug -p:Platform=Posix
      - name: Test
        working-directory: _tests/net10.0
        run: >
          dotnet test
          Requestarr.Api.V1.Test.dll Requestarr.Common.Test.dll Requestarr.Core.Test.dll
          Requestarr.Host.Test.dll Requestarr.Libraries.Test.dll Requestarr.Mono.Test.dll
          Requestarr.Update.Test.dll
          "--filter:${{ env.TEST_FILTER_COMMON }}&Category!=WINDOWS"

  backend-windows:
    name: Backend (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build src/Requestarr.sln -c Debug -p:Platform=Windows
      - name: Test
        working-directory: _tests/net10.0
        shell: bash
        run: >
          dotnet test
          Requestarr.Api.V1.Test.dll Requestarr.Common.Test.dll Requestarr.Core.Test.dll
          Requestarr.Host.Test.dll Requestarr.Libraries.Test.dll Requestarr.Update.Test.dll
          Requestarr.Windows.Test.dll
          "--filter:${{ env.TEST_FILTER_COMMON }}&Category!=LINUX"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile --network-timeout 120000
      - name: Type check
        run: yarn tsc --noEmit
      - name: Lint
        run: yarn lint
      - name: Style lint
        run: yarn stylelint-linux
      - name: Production build
        run: yarn build --env production

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: requestarr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Single status for the main branch ruleset to require.
  build:
    name: build
    if: always()
    needs: [backend-linux, backend-windows, frontend, docker]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
