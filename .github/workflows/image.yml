name: Image

# Publishes Requestarr's container image to GitHub's container registry (docs/development.md#published-images):
#   push to staging (a promotion, or a fix into staging): builds the number on top of the changelog,
#     ghcr.io/requestarr/requestarr:staging and :0.7.0004, and tags the commit v0.7.0004 (docs/development.md#versions)
#   push to main (only on the owner's "ship it"): builds nothing; adds :0.7 and :latest to the image staging published
#     from the same commit, so production runs the exact file the testers ran
#   Run workflow on any branch with a tag starting "test-": that tag only, for trying the workflow (delete it after).
# Two architectures: linux/amd64 (most home servers and NAS boxes) and linux/arm64 (Raspberry Pi 4 and 5, ARM NAS
# boxes, Apple silicon), the same pair the other Servarr apps publish.
on:
  push:
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      tag:
        description: A test tag to publish this branch under, starting "test-" (nothing else is tagged)
        required: true

# contents: write only to record each staging publish as a v0.7.0004 tag.
permissions:
  contents: write
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/requestarr/requestarr

jobs:
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Full history: which builds shipped is read from main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Number and tags
        id: tags
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          TEST_TAG: ${{ inputs.tag }}
        run: |
          # .github/build_numbers.py decides: mode (build or retag), number, label, tags, source, record (the tag to add).
          if ! plan=$(python3 .github/build_numbers.py image "$EVENT" "$BRANCH" "$GITHUB_SHA" ${TEST_TAG:+"$TEST_TAG"}); then
            echo "::error::$(echo "$plan" | sed -n 's/^error=//p')"
            exit 1
          fi
          echo "$plan" | tee -a "$GITHUB_OUTPUT"
          tags=$(echo "$plan" | sed -n 's/^tags=//p')
          echo "first=${tags%%,*}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
        if: steps.tags.outputs.mode == 'build'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Ship it: the release tags go on the image staging published from this commit; nothing is built.
      - name: Add the release tags to staging's image
        if: steps.tags.outputs.mode == 'retag'
        env:
          SOURCE: ${{ steps.tags.outputs.source }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          revision=$(docker buildx imagetools inspect "$SOURCE" --format '{{ json .Image }}' | jq -r 'if has("config") then . else [.[]][0] end | .config.Labels["org.opencontainers.image.revision"]')
          if [ "$revision" != "$GITHUB_SHA" ]; then
            echo "::error::$SOURCE was built from $revision, not this commit: only the image staging published from it ships."
            exit 1
          fi
          args=()
          for tag in ${TAGS//,/ }; do args+=(--tag "$tag"); done
          docker buildx imagetools create "${args[@]}" "$SOURCE"
          echo "Shipped \`$SOURCE\` as \`${TAGS//,/\`, \`}\` (the same image, not rebuilt)." >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push (linux/amd64, linux/arm64)
        if: steps.tags.outputs.mode == 'build'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BUILD_NUMBER=${{ steps.tags.outputs.number }}
            RELEASE_VERSION=${{ steps.tags.outputs.label }}
          labels: |
            org.opencontainers.image.title=Requestarr
            org.opencontainers.image.description=Discord requests for Sonarr and Radarr, with per-user access, approvals and removal votes.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.version=${{ steps.tags.outputs.label }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

      # The record every later number is counted from: a tag on the commit that was built (docs/development.md#versions).
      - name: Record the build number
        if: steps.tags.outputs.record != ''
        env:
          RECORD: ${{ steps.tags.outputs.record }}
        run: |
          git tag "$RECORD" "$GITHUB_SHA"
          git push origin "refs/tags/$RECORD"
          echo "Build number: \`${RECORD#v}\` (tag \`$RECORD\`)" >> "$GITHUB_STEP_SUMMARY"

      # Each platform's image, as published: no file that could hold secrets, no secret-looking environment variable or
      # build step, and it starts and answers on its port.
      - name: Check the published image
        if: steps.tags.outputs.mode == 'build'
        env:
          REF: ${{ steps.tags.outputs.first }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          {
            echo "### Published"
            echo "Tags: \`${TAGS//,/\`, \`}\`"
            echo
            echo "| Platform | Digest | Compressed size |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for platform in linux/amd64 linux/arm64; do
            echo "== $platform"
            digest=$(docker buildx imagetools inspect "$REF" --raw | jq -r --arg arch "${platform#linux/}" '.manifests[] | select(.platform.architecture == $arch) | .digest')
            size=$(docker buildx imagetools inspect "$IMAGE@$digest" --raw | jq '[.layers[].size] | add')
            echo "| $platform | \`$digest\` | $((size / 1048576)) MB |" | tee -a "$GITHUB_STEP_SUMMARY"
            docker pull -q --platform "$platform" "$IMAGE@$digest"

            # The public CA certificates the base image trusts are .pem files; everything else is searched.
            files=$(docker run --rm --user 0 --platform "$platform" --entrypoint sh "$IMAGE@$digest" -c \
              'find / -xdev \( -path /etc/ssl/certs -o -path /usr/lib/ssl -o -path /usr/share/ca-certificates -o -path /proc \) -prune -o \( -name "*.env" -o -name ".env" -o -name "secrets*" -o -name "*.pem" -o -name "*.key" -o -name "id_rsa*" -o -name "*.pfx" \) -print')
            if [ -n "$files" ]; then echo "::error::$platform image has files that could hold secrets: $files"; exit 1; fi
            env_names=$(docker image inspect "$IMAGE@$digest" --format '{{range .Config.Env}}{{println .}}{{end}}' | cut -d= -f1)
            echo "Environment: $(echo $env_names)"
            if echo "$env_names" | grep -iE 'TOKEN|SECRET|PASSWORD|API_?KEY'; then echo "::error::secret-looking environment variable"; exit 1; fi
            if docker history --no-trunc --format '{{.CreatedBy}}' "$IMAGE@$digest" | grep -iE '(TOKEN|SECRET|PASSWORD|API_?KEY)='; then
              echo "::error::a build step sets a secret-looking value"; exit 1
            fi

            docker run -d --name "check-${platform#linux/}" --platform "$platform" -e DOTNET_EnableWriteXorExecute=0 "$IMAGE@$digest" >/dev/null
            for i in $(seq 1 60); do
              if docker exec "check-${platform#linux/}" curl -fsS http://localhost:9797/ping >/dev/null 2>&1; then
                echo "$platform: starts and answers /ping"
                break
              fi
              [ "$i" = 60 ] && { docker logs "check-${platform#linux/}" | tail -40; echo "::error::$platform image didn't start"; exit 1; }
              sleep 5
            done
            docker rm -f "check-${platform#linux/}" >/dev/null
          done
          echo "No secret files, variables or build steps; both platforms start." >> "$GITHUB_STEP_SUMMARY"
