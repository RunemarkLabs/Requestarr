name: Dependency updates

# Dependabot's pull requests into dev (docs/development.md#dependency-updates; .github/dependency_updates.py does the
# work). A new update is labelled: patch and minor "automatic update", major "needs review" (held, with a comment).
# Automatic updates go one at a time: the next version and its changelog section are added, build is started on that
# commit and waited for, then the update is merged (or held if build failed) and the next one starts. It also runs when
# dev moves and every hour, so a waiting update always carries dev's next version (docs/development.md#versions).
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [dev]
  push:
    branches: [dev]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

# Pull requests opened by Dependabot get a read-only token unless the workflow asks for more.
permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: dependency-updates

jobs:
  sort:
    name: Sort a new update
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - id: meta
        uses: dependabot/fetch-metadata@v2
      - name: Label it automatic or held for review, and security
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          GROUP: ${{ steps.meta.outputs.dependency-group }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          DEPENDENCIES: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: python3 .github/dependency_updates.py sort

  update:
    name: Version and merge the next automatic update
    needs: sort
    if: >
      always() && needs.sort.result != 'failure' &&
      (github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Self-test
        run: python3 .github/dependency_updates.py --self-test
      - name: Next automatic update
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/dependency_updates.py update
