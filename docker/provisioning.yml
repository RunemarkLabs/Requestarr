# Provisioning for the local dev stack. Applied by Requestarr on every start:
# keys present here win over UI changes; keys left out are untouched.
# Secrets are ${VAR} references resolved from docker/secrets.env.
# ${VAR:-default} supplies a default; $${VAR} is a literal.
version: 1

general:
  instanceName: Requestarr (dev)
  logLevel: debug
  analyticsEnabled: false

auth:
  method: forms
  required: disabledForLocalAddresses
  username: ${REQUESTARR_ADMIN_USERNAME}
  password: ${REQUESTARR_ADMIN_PASSWORD}
  apiKey: ${REQUESTARR_API_KEY}

# mediaServers is validated now and applied once that feature lands.

discord:
  botToken: ${DISCORD_BOT_TOKEN:-}
  applicationId: ${DISCORD_APPLICATION_ID:-}
  guildId: ${DISCORD_TEST_GUILD_ID:-}
  # Requestarr creates a "Requestarr Admin" role on first start; holders are admins
  # (the server owner always is). Optionally use an existing role instead:
  adminRoleId: ${DISCORD_ADMIN_ROLE_ID:-}

# Optional: cast from The Movie Database (leave TMDB_API_KEY unset to skip).
tmdb:
  apiKey: ${TMDB_API_KEY:-}

# Downloads: Sonarr and Radarr call Requestarr's webhook on the Compose network; the poll backs it up.
availability:
  webhookUrl: http://requestarr:9797
  pollMinutes: 5

# Any number of instances per type; names must be unique.
backends:
  sonarr:
    - name: Sonarr (test)
      url: http://sonarr-test:8989
      apiKey: ${SONARR_TEST_API_KEY}
      qualityProfile: HD-1080p
      rootFolder: /data/tv
      seriesType: standard
      default: true
  radarr:
    - name: Radarr (test)
      url: http://radarr-test:7878
      apiKey: ${RADARR_TEST_API_KEY}
      qualityProfile: HD-1080p
      rootFolder: /data/movies
      default: true

mediaServers:
  plex: []
