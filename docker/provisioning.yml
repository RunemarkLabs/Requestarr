# Provisioning for the local test stacks (QA and dev). Applied by Requestarr on every start:
# keys present here win over UI changes; keys left out are untouched.
# Secrets are ${VAR} references resolved from docker/secrets.env (each stack gets its own Discord values).
# ${VAR:-default} supplies a default; $${VAR} is a literal.
version: 1

general:
  instanceName: Requestarr (${REQUESTARR_STACK:-dev})
  logLevel: debug
  analyticsEnabled: false

auth:
  method: forms
  required: disabledForLocalAddresses
  username: ${REQUESTARR_ADMIN_USERNAME}
  password: ${REQUESTARR_ADMIN_PASSWORD}
  apiKey: ${REQUESTARR_API_KEY}

# mediaServers is validated now and applied once that feature lands.

discord:
  botToken: ${DISCORD_BOT_TOKEN:-}
  applicationId: ${DISCORD_APPLICATION_ID:-}
  guildId: ${DISCORD_TEST_GUILD_ID:-}
  # Requestarr creates a "Requestarr Admin" role on first start; holders are admins
  # (the server owner always is). Optionally use an existing role instead:
  adminRoleId: ${DISCORD_ADMIN_ROLE_ID:-}

# Optional: cast from The Movie Database (leave TMDB_API_KEY unset to skip).
tmdb:
  apiKey: ${TMDB_API_KEY:-}

# Downloads: Sonarr and Radarr call Requestarr's webhook on the Compose network; the poll backs it up.
availability:
  webhookUrl: http://requestarr:9797
  pollMinutes: 5

# Removal votes, in days (all optional; these are the defaults).
removal:
  voteDays: 7
  requesterTimeoutDays: 7
  reminderDay: 5

# Access requests from the welcome channel (these are the defaults; the admin web portal can change them).
# After a denial, someone can ask again after denialCooldownDays. The spam guard counts only clicks that can't
# do anything, within the last windowMinutes: shortCooldownClicks of them wait shortCooldownMinutes,
# longCooldownClicks wait longCooldownHours, and blockClicks more within blockWithinHours block them.
accessRequests:
  denialCooldownDays: 7
  spam:
    windowMinutes: 60
    shortCooldownClicks: 5
    shortCooldownMinutes: 1
    longCooldownClicks: 10
    longCooldownHours: 24
    blockClicks: 5
    blockWithinHours: 24

# The bot's picture and banner (setup guide 5.13). These test bots had theirs uploaded by hand before Requestarr managed
# them, so Requestarr's always win here. REQUESTARR_BOT_PROFILE=false starts a stack with it off (live check).
botProfile:
  keepUpToDate: ${REQUESTARR_BOT_PROFILE:-true}
  takeOver: true

# Any number of instances per type; names must be unique.
backends:
  sonarr:
    - name: Sonarr (test)
      url: http://sonarr-test:8989
      apiKey: ${SONARR_TEST_API_KEY}
      qualityProfile: HD-1080p
      rootFolder: /data/tv
      seriesType: standard
      default: true
  radarr:
    - name: Radarr (test)
      url: http://radarr-test:7878
      apiKey: ${RADARR_TEST_API_KEY}
      qualityProfile: HD-1080p
      rootFolder: /data/movies
      default: true

mediaServers:
  plex: []
