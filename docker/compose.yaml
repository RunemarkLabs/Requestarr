# Local test stacks. Start with:  .\docker\dev.ps1 up  (PowerShell)  or  docker/dev.sh up
# One file, two stacks that run side by side: `qa` (the owner's manual QA, the default) and `dev`
# (Claude Code's automated testing). The scripts pick the stack and set the variables below; each stack
# is its own Compose project (requestarr-qa, requestarr-dev), so containers, volumes and the network
# are separate, its ports differ, and it gets only its own Discord bot's values.
# Everything here is disposable and separate from any production deployment.
name: requestarr-${REQUESTARR_STACK:?run through docker/dev.ps1 or docker/dev.sh}

services:
  requestarr:
    # Built by the scripts from the stack's branch (qa or dev), never from uncommitted files.
    image: requestarr:${REQUESTARR_STACK}
    pull_policy: never
    environment:
      REQUESTARR_PROVISIONING_FILE: /provisioning/provisioning.yml
      TZ: Etc/UTC
      REQUESTARR_STACK: ${REQUESTARR_STACK}
      # Which "what's new" posts this server keeps (docs/development.md#version-posts): QA shows the versions staging
      # doesn't have yet (the scripts look up what was last published for staging), dev only the version running now.
      REQUESTARR_ENVIRONMENT: ${REQUESTARR_STACK}
      REQUESTARR_STAGED_VERSIONS: ${REQUESTARR_STAGED_VERSIONS:-}
      # Marks a local test stack: only then can `dev.ps1 fast-votes on` take effect.
      REQUESTARR_DEV_STACK: "true"
      REQUESTARR_ADMIN_USERNAME: ${REQUESTARR_ADMIN_USERNAME}
      REQUESTARR_ADMIN_PASSWORD: ${REQUESTARR_ADMIN_PASSWORD}
      REQUESTARR_API_KEY: ${REQUESTARR_API_KEY}
      SONARR_TEST_API_KEY: ${SONARR_TEST_API_KEY}
      RADARR_TEST_API_KEY: ${RADARR_TEST_API_KEY}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      # This stack's bot and server only (QA: DISCORD_*, dev: DEV_DISCORD_* in secrets.env).
      DISCORD_BOT_TOKEN: ${STACK_DISCORD_BOT_TOKEN:-}
      DISCORD_APPLICATION_ID: ${STACK_DISCORD_APPLICATION_ID:-}
      DISCORD_TEST_GUILD_ID: ${STACK_DISCORD_GUILD_ID:-}
      DISCORD_ADMIN_ROLE_ID: ${STACK_DISCORD_ADMIN_ROLE_ID:-}
    volumes:
      - requestarr-config:/config
      - ./provisioning.yml:/provisioning/provisioning.yml:ro
    ports:
      - "127.0.0.1:${STACK_REQUESTARR_PORT:?run through docker/dev.ps1 or docker/dev.sh}:9797"
    depends_on:
      test-backends-init:
        condition: service_healthy
    restart: unless-stopped

  # Dedicated test backends. Known API keys come from secrets.env; auth is left to
  # localhost-only port binding so the owner can watch them in a browser.
  sonarr-test:
    image: ${SONARR_TEST_IMAGE:-lscr.io/linuxserver/sonarr:latest}
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      SONARR__AUTH__APIKEY: ${SONARR_TEST_API_KEY:?run docker/dev.sh init}
      SONARR__AUTH__METHOD: External
      SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
      SONARR__LOG__ANALYTICSENABLED: "false"
    volumes:
      - sonarr-test-config:/config
      - test-media:/data
    ports:
      - "127.0.0.1:${STACK_SONARR_TEST_PORT:?run through docker/dev.ps1 or docker/dev.sh}:8989"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8989/ping"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped

  radarr-test:
    image: ${RADARR_TEST_IMAGE:-lscr.io/linuxserver/radarr:latest}
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      RADARR__AUTH__APIKEY: ${RADARR_TEST_API_KEY:?run docker/dev.sh init}
      RADARR__AUTH__METHOD: External
      RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
      RADARR__LOG__ANALYTICSENABLED: "false"
    volumes:
      - radarr-test-config:/config
      - test-media:/data
    ports:
      - "127.0.0.1:${STACK_RADARR_TEST_PORT:?run through docker/dev.ps1 or docker/dev.sh}:7878"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7878/ping"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped

  # Creates the media folders and registers them as root folders, then stays up
  # (healthy) so `docker compose up --wait` and depends_on can rely on it.
  test-backends-init:
    image: ${CURL_IMAGE:-curlimages/curl:latest}
    user: "0:0"
    environment:
      SONARR_TEST_API_KEY: ${SONARR_TEST_API_KEY}
      RADARR_TEST_API_KEY: ${RADARR_TEST_API_KEY}
    volumes:
      - test-media:/data
      - ./test-backends-init.sh:/test-backends-init.sh:ro
    entrypoint: ["/bin/sh", "/test-backends-init.sh"]
    depends_on:
      sonarr-test:
        condition: service_healthy
      radarr-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 3s
      timeout: 3s
      start_period: 120s
      retries: 40

volumes:
  requestarr-config:
  sonarr-test-config:
  radarr-test-config:
  test-media:
